name: CI - macOS

on: [pull_request, push]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  ci:
    name: Build
    runs-on: macos-26-intel
    permissions:
      actions: write

    strategy:
      fail-fast: false
      matrix:
        libtorrent:
          - version: "2.1.2"
            boost_major_version: "1"
            boost_minor_version: "92"
            boost_patch_version: "0"
            libt_build_flags: ""
        qbt_gui: ["GUI=ON"]
        qt_version: ["6.12.0"]

    env:
      boost_path: "${{ github.workspace }}/../boost"
      libtorrent_path: "${{ github.workspace }}/../libtorrent"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: nick-fields/retry@v4
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        with:
          timeout_seconds: 120
          retry_wait_seconds: 20
          max_attempts: 1
          command: |
            brew update > /dev/null
            brew install \
              cmake ninja zlib
            # preinstalled on the image: cmake ninja

      - name: Install boost
        run: |
          boost_url="https://archives.boost.io/release/${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}/source/boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}.tar.gz"
          boost_url2="https://sourceforge.net/projects/boost/files/boost/${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}/boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}.tar.gz"
          set +e
          curl -L -o "${{ runner.temp }}/boost.tar.gz" "$boost_url"
          tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."; _exitCode="$?"
          if [ "$_exitCode" -ne "0" ]; then
            curl -L -o "${{ runner.temp }}/boost.tar.gz" "$boost_url2"
            tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."; _exitCode="$?"
          fi
          mv "${{ github.workspace }}/.."/boost_* "${{ env.boost_path }}"
          cd "${{ env.boost_path }}"
          ./bootstrap.sh
          ./b2 stage --stagedir=./ --with-headers

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          archives: qtbase qtdeclarative qtsvg qttools
          modules: qtimageformats
          # Not sure why Qt made a hard dependency on qtdeclarative, try removing it when Qt > 6.4.0
          cache: true

      - name: Install OpenSSL
        shell: bash
        run: |
          set -euxo pipefail

          OPENSSL_VERSION="4.0.2"
          OPENSSL_PREFIX="${RUNNER_TEMP}/openssl"

          curl -fL \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" \
            -o "${RUNNER_TEMP}/openssl.tar.gz"

          tar -xzf "${RUNNER_TEMP}/openssl.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/openssl-${OPENSSL_VERSION}"

          ./Configure \
            --prefix="${OPENSSL_PREFIX}" \
            --openssldir="${OPENSSL_PREFIX}/ssl" \
            no-shared

          make -j"$(sysctl -n hw.ncpu)"
          make install_sw

          echo "${OPENSSL_PREFIX}/bin" >> "${GITHUB_PATH}"
          echo "OPENSSL_ROOT_DIR=${OPENSSL_PREFIX}" >> "${GITHUB_ENV}"
          echo "OPENSSL_DIR=${OPENSSL_PREFIX}" >> "${GITHUB_ENV}"
          echo "OPENSSL_PREFIX=${OPENSSL_PREFIX}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${OPENSSL_PREFIX}" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig" >> "${GITHUB_ENV}"
          echo "CFLAGS=-isystem ${OPENSSL_PREFIX}/include ${CFLAGS:-}" >> "${GITHUB_ENV}"
          echo "CXXFLAGS=-isystem ${OPENSSL_PREFIX}/include ${CXXFLAGS:-}" >> "${GITHUB_ENV}"
          echo "LDFLAGS=-L${OPENSSL_PREFIX}/lib ${LDFLAGS:-}" >> "${GITHUB_ENV}"

      - name: Install libtorrent
        run: |
          git clone \
            --branch v${{ matrix.libtorrent.version }} \
            --depth 1 \
            --recurse-submodules \
            https://github.com/arvidn/libtorrent.git \
            ${{ env.libtorrent_path }}
          cd ${{ env.libtorrent_path }}
          cmake \
            -B build \
            -G "Ninja" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -Ddeprecated-functions=OFF \
            ${{ matrix.libtorrent.libt_build_flags }}
          cmake --build build
          sudo cmake --install build

      - name: Build qBittorrent
        shell: bash
        run: |
          set -euxo pipefail

          # qBittorrent enables -Wold-style-cast for its own sources. Do not
          # apply that warning to OpenSSL headers; instead, remove the warning
          # from the qBittorrent compile options entirely for this CI build.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("cmake/Modules/CommonConfig.cmake")
          text = path.read_text()
          old = "        -Wold-style-cast\\n"
          if old not in text:
              raise SystemExit("Expected -Wold-style-cast entry was not found")
          path.write_text(text.replace(old, ""))
          PY

          cmake \
            -B build \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBOOST_ROOT="${{ env.boost_path }}/lib/cmake" \
            -DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DTESTING=ON \
            -DVERBOSE_CONFIGURE=ON \
            -D${{ matrix.qbt_gui }}
          cmake --build build --target qbt_update_translations
          cmake --build build
          cmake --build build --target check
          if [ "${{ matrix.qbt_gui }}" = "GUI=ON" ]; then
            build/qbittorrent.app/Contents/MacOS/qbittorrent -v
          else
            build/qbittorrent-nox.app/Contents/MacOS/qbittorrent-nox -v
          fi

      - name: Prepare build artifacts
        run: |
          appName="qbittorrent"
          if [ "${{ matrix.qbt_gui }}" = "GUI=OFF" ]; then
            appName="qbittorrent-nox"
          fi
          pushd build
          # packaging
          macdeployqt "$appName.app" -no-strip
          # code signing
          xattr -cr "$appName.app"
          codesign --force --sign - \
            "$appName.app" \
            "$appName.app/Contents/Frameworks"/* \
            "$appName.app/Contents/MacOS/$appName"
          codesign --verify --deep --strict -v "$appName.app"
          # create .dmg
          PACKAGE_RETRY=0
          while [ "$PACKAGE_RETRY" -lt "3" ]; do
            if hdiutil create -fs HFS+ -srcfolder "$appName.app" -volname "$appName" "$appName.dmg"; then
              break
            fi
            sleep 5
            PACKAGE_RETRY=$((PACKAGE_RETRY + 1))
            echo "Retry $PACKAGE_RETRY..."
          done
          popd
          # prepare upload folder
          mkdir upload
          cp "build/$appName.dmg" upload
          mkdir upload/cmake
          cp build/compile_commands.json upload/cmake
          mkdir upload/cmake/libtorrent
          cp ${{ env.libtorrent_path }}/build/compile_commands.json upload/cmake/libtorrent

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qBittorrent-CI_macOS_${{ matrix.qbt_gui }}_libtorrent-${{ matrix.libtorrent.version }}_Qt-${{ matrix.qt_version }}
          path: upload
